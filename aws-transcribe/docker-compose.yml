services:
  chainlit-voice-chat:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # AWS Configuration
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      
      # Optional: Botnoi API
      BOTNOI_API_KEY: ${BOTNOI_API_KEY:-}
      
      # Chainlit Configuration
      CHAINLIT_HOST: 0.0.0.0
      CHAINLIT_PORT: 8000
      
      # AWS Credentials (for local testing) - only if set
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      # Mount AWS credentials if using default profile (only on Unix systems)
      - ~/.aws:/home/app/.aws:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Add logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 